# CircleCI - a free-for-open-source, third-party CI service, deliberately
# independent of GitHub Actions billing. Added 2026-09-14 because GitHub
# Actions on this account is blocked by an unpaid-invoice suspension (that
# suspension only affects GitHub's own Actions infrastructure, not
# integrations that just talk to GitHub over the API/webhooks). Cirrus CI
# was tried first but was unreachable (ERR_CONNECTION_CLOSED) from Jeremy's
# location, so this uses CircleCI instead - a long-established, widely
# reachable provider with a generous open-source free tier (400,000 Linux
# credits/month at last check).
#
# This now fully replaces .github/workflows/ci.yml (which has been removed -
# see TODO.md), porting both of its jobs:
#   - verify: typecheck, the 100%-enforced coverage gate, build, the storage
#     backup/restore drill, Playwright e2e, and the manifest check.
#   - container: builds the Docker image and verifies offline backup/restore
#     and the embedded build revision inside it, using CircleCI's
#     setup_remote_docker (its equivalent of GitHub Actions' docker-in-docker
#     support on ubuntu-latest runners).
version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run storage:drill
      - run:
          name: Install Playwright's Chromium and OS dependencies
          command: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run manifest -- --check
      - store_artifacts:
          path: test-results
          destination: test-results

  container:
    docker:
      - image: cimg/base:2024.11
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Build the verified revision
          command: docker build --build-arg MIRROR_BUILD_REVISION="$CIRCLE_SHA1" -t mirror-verified .
      - run:
          name: Verify recovery inside the runtime image without network access
          command: docker run --rm --network none --entrypoint node mirror-verified scripts/restore-drill.mjs
      - run:
          name: Verify embedded revision and record image identity
          command: |
            docker run --rm --network none -e EXPECTED_REVISION="$CIRCLE_SHA1" --entrypoint node mirror-verified -e 'require("node:assert/strict").equal(process.env.MIRROR_BUILD_REVISION, process.env.EXPECTED_REVISION)'
            docker image inspect --format '{{.Id}} {{index .Config.Labels "org.opencontainers.image.revision"}}' mirror-verified

workflows:
  verify:
    jobs:
      - verify
      - container:
          requires:
            - verify
