[workspace]
resolver = "3"
members = [
    "crates/mirror-store",
    "crates/mirror-protocol",
    "crates/mirror-formats",
    "crates/mirror-server",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
mirror-store = { path = "crates/mirror-store" }
mirror-protocol = { path = "crates/mirror-protocol" }
mirror-formats = { path = "crates/mirror-formats" }

aes-gcm = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
